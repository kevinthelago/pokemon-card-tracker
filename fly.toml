# Fly.io deployment configuration for the CardGuard API.
# The web (Leptos SSR) server is deployed as a separate app — see deploy/web.fly.toml.
# TODO (H2): fill in actual app names and region after provisioning.

app = "cardguard-api"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile.api"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
