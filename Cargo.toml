[workspace]
members = ["crates/domain", "crates/api", "crates/web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono", "runtime-tokio-native-tls", "rust_decimal"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
rust_decimal = { version = "1", features = ["serde-with-str"] }

[profile.release]
opt-level = 3
lto = "thin"
